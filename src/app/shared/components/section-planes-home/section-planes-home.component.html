<section class="relative w-full min-h-[60vh] sm:min-h-[70vh] flex items-center justify-center overflow-hidden mb-24 bg-transparent">

    <!-- Solo imagen (parallax); borde extra para que el movimiento no deje ver el fondo -->
    <div class="absolute inset-0 overflow-hidden">
        <div #parallaxLayer
             class="absolute -inset-[18%] will-change-transform">
            <div class="relative size-full min-h-full">
                <img src="assets/planes/planes2.png"
                     class="block size-full object-cover object-center select-none pointer-events-none"
                     alt="Planes de salud"
                     draggable="false">
                <div class="absolute inset-0 z-[1] pointer-events-none
                            bg-[linear-gradient(90deg,rgba(0,0,0,0.78)_0%,rgba(0,0,0,0.55)_22%,rgba(0,0,0,0.28)_48%,rgba(0,0,0,0.08)_72%,transparent_100%)]"
                     aria-hidden="true"></div>
            </div>
        </div>
    </div>

    <!-- Contenido -->
    <div class="absolute inset-0 flex flex-col justify-center
                items-center sm:items-start
                text-center sm:text-left
                px-4 sm:px-16 max-w-6xl mx-auto z-20">

        <h2 class="text-white text-3xl sm:text-5xl font-bold mb-4"
            data-aos="fade-left" data-aos-delay="150">
            Elegí el plan ideal para vos
        </h2>

        <p class="text-white text-sm sm:text-lg max-w-2xl mb-6"
           data-aos="fade-left" data-aos-delay="300">
            Contamos con planes de salud pensados para cada etapa de tu vida,
            combinando cobertura médica, atención personalizada y beneficios exclusivos.
        </p>

        <!-- Botón -->
        <a routerLink="/planes"
           data-aos="fade-left" data-aos-delay="450"
           class="inline-block bg-[#00cba9] hover:bg-[#00b89a]
                  text-white font-semibold px-6 py-3 rounded-full
                  transition duration-300 shadow-lg hover:scale-105">
            Ver planes
        </a>

    </div>

</section>
