<section class="relative py-20 px-4 sm:px-10 w-full overflow-x-clip box-border">

    <!-- Fondo sutil -->
    <div class="absolute inset-0 bg-gradient-to-br from-[#00cba9]/10 via-white to-[#00cba9]/5 pointer-events-none"></div>

    <!-- Título -->
    <div class="text-center mb-12 sm:mb-16 relative z-10" data-aos="fade-up">
        <h2 class="text-3xl sm:text-5xl font-bold text-gray-800 mb-4">
            Nuestros Planes
        </h2>
        <p class="text-gray-600 max-w-2xl mx-auto" data-aos="fade-up" data-aos-delay="150">
            Elegí la cobertura que mejor se adapta a tu estilo de vida.
        </p>
    </div>

    <div class="max-w-7xl mx-auto relative z-10 w-full min-w-0" data-aos="fade-up" data-aos-delay="300">
        <!-- Flechas sobre el carrusel: no roban ancho al track en mobile -->
        <div class="relative w-full max-w-full mx-auto min-w-0 planes-carousel-shell">
            <button type="button"
                    class="planes-swiper-button-prev absolute left-0 top-[42%] z-20 -translate-y-1/2 flex h-9 w-9 sm:h-11 sm:w-11 items-center justify-center rounded-full border border-[#00cba9]/35 bg-white/95 text-[#00cba9] shadow-md backdrop-blur-sm transition hover:bg-[#00cba9] hover:text-white hover:shadow-lg disabled:opacity-30 sm:left-1 lg:left-0"
                    aria-label="Plan anterior">
                <svg class="h-4 w-4 sm:h-5 sm:w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>

            <button type="button"
                    class="planes-swiper-button-next absolute right-0 top-[42%] z-20 -translate-y-1/2 flex h-9 w-9 sm:h-11 sm:w-11 items-center justify-center rounded-full border border-[#00cba9]/35 bg-white/95 text-[#00cba9] shadow-md backdrop-blur-sm transition hover:bg-[#00cba9] hover:text-white hover:shadow-lg disabled:opacity-30 sm:right-1 lg:right-0"
                    aria-label="Plan siguiente">
                <svg class="h-4 w-4 sm:h-5 sm:w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>

            <div #planesSwiper class="swiper planes-swiper w-full max-w-full min-w-0">
                <div class="swiper-wrapper pb-1">
                    @for (plan of planes; track plan.title) {
                        <div class="swiper-slide">
                            <article
                                class="plan-card group h-full backdrop-blur-md bg-white/25 border border-[#00cba9]/15 hover:border-[#00cba9]/40 hover:border-2 rounded-2xl shadow-lg p-5 sm:p-6 transition duration-300 hover:shadow-2xl hover:bg-white/40">
                                <img [src]="plan.imageSrc"
                                     [alt]="plan.imageAlt"
                                     class="w-full h-32 sm:h-36 object-contain mb-4 transition duration-300 group-hover:scale-105"
                                     loading="lazy"
                                     decoding="async">

                                <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-1">
                                    {{ plan.title }}
                                </h3>

                                <p class="text-sm text-[#00cba9] font-semibold mb-3">
                                    {{ plan.tagline }}
                                </p>

                                <p class="text-sm text-gray-600 leading-relaxed">
                                    {{ plan.description }}
                                </p>
                            </article>
                        </div>
                    }
                </div>
                <!-- Paginación dentro de .swiper: bullets alineados y sin recortes -->
                <div class="planes-swiper-pagination"></div>
            </div>
        </div>
    </div>

</section>
