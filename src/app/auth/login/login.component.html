<section class="bg-[#0099ff] min-h-screen flex items-center justify-center px-4 relative overflow-hidden">

    <!-- Fondo decorativo -->
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_top,white,transparent)]"></div>

    <!-- Card -->
    <div class="w-full max-w-md backdrop-blur-md bg-white/80 border border-white/40 
                rounded-2xl shadow-xl p-8 relative z-10">

        <!-- Título -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto flex items-center justify-center 
                        rounded-full bg-[#00cba9] text-white text-2xl shadow-md mb-3">
                <i class="fa-solid fa-user"></i>
            </div>

            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800">
                Iniciar sesión
            </h2>

            <p class="text-sm text-gray-600 mt-1">
                Accedé a tu cuenta de salud
            </p>
        </div>

        <!-- FORM -->
        <form #formRef="ngForm" (ngSubmit)="login(formRef)" class="space-y-4">

            <!-- Email -->
            <div>
                <label class="block text-sm font-semibold mb-1">Email</label>
                <input type="email"
                       name="email"
                       ngModel
                       required
                       placeholder="tu@email.com"
                       class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 
                       focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition" />
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-semibold mb-1">Contraseña</label>
                <input type="password"
                       name="password"
                       ngModel
                       required
                       placeholder="••••••••"
                       class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 
                       focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition" />
            </div>

            <!-- Opciones -->
            <div class="flex justify-between items-center text-sm">
                <label class="flex items-center gap-2">
                    <input type="checkbox" class="accent-[#00cba9]">
                    Recordarme
                </label>

                <a href="#" class="text-[#00cba9] hover:underline">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <!-- Botón -->
            <button type="submit"
                    [disabled]="enviando"
                    class="w-full bg-[#00cba9] hover:bg-[#00b89a] 
                    text-white font-semibold py-3 rounded-lg 
                    transition duration-300 shadow-md 
                    disabled:opacity-60 disabled:cursor-not-allowed 
                    hover:scale-[1.02] flex items-center justify-center gap-2">

                <span *ngIf="enviando" 
                      class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin">
                </span>

                {{ enviando ? 'Ingresando...' : 'Ingresar' }}
            </button>

        </form>

        <!-- Separador -->
        <div class="flex items-center gap-3 my-6">
            <div class="flex-1 h-px bg-gray-300"></div>
            <span class="text-sm text-gray-500">o</span>
            <div class="flex-1 h-px bg-gray-300"></div>
        </div>

        <!-- Badges (igual estilo que contacto) -->
        <div class="flex flex-wrap justify-center gap-2">

            <div class="flex items-center gap-2 px-3 py-1.5 border border-[#00cba9]/40 
                        rounded-full text-[#00cba9] text-xs 
                        bg-[#00cba9]/10 backdrop-blur-sm">

                <i class="fa-solid fa-shield-halved"></i>
                <span>Seguro</span>
            </div>

            <div class="flex items-center gap-2 px-3 py-1.5 border border-[#00cba9]/40 
                        rounded-full text-[#00cba9] text-xs 
                        bg-[#00cba9]/10 backdrop-blur-sm">

                <i class="fa-solid fa-lock"></i>
                <span>Privado</span>
            </div>

            <div class="flex items-center gap-2 px-3 py-1.5 border border-[#00cba9]/40 
                        rounded-full text-[#00cba9] text-xs 
                        bg-[#00cba9]/10 backdrop-blur-sm">

                <i class="fa-solid fa-user-check"></i>
                <span>Acceso rápido</span>
            </div>

        </div>

    </div>

</section>
