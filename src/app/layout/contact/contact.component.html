<section class="bg-[#00cba9] py-20 px-4 sm:px-10 relative overflow-hidden">

    <!-- Fondo decorativo -->
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_top,white,transparent)]"></div>

    <h2 class="text-3xl sm:text-5xl font-bold text-white text-center mb-14"
        data-aos="fade-up"
        data-aos-anchor-placement="top-bottom">
        Contactanos
    </h2>

    <div class="max-w-6xl mx-auto grid lg:grid-cols-2 gap-10 items-center relative z-10">

        <!-- TEXTO -->
        <div class="text-white"
             data-aos="fade-up"
             data-aos-delay="150"
             data-aos-anchor-placement="top-bottom">

            <h2 class="text-2xl sm:text-4xl font-bold mb-4 text-white">
                <i class="fa-solid fa-phone text-4xl p-3 border-2 border-white rounded-full mb-3"></i>
                Estamos para ayudarte
            </h2>

            <p class="text-sm sm:text-lg max-w-md mb-6">
                Dejanos tu consulta y te responderemos a la brevedad con la atención que merecés.
            </p>

            <div class="flex flex-wrap gap-3 mt-4">

            <!-- Badge 1 -->
            <div class="flex items-center gap-2 px-4 py-2 border border-white/40 
                        rounded-full text-white text-sm sm:text-base 
                        backdrop-blur-sm bg-white/10 
                        hover:bg-white/20 transition duration-300">

                <i class="fa-solid fa-heart-pulse"></i>
                <span>Atención médica integral</span>
            </div>

            <!-- Badge 2 -->
            <div class="flex items-center gap-2 px-4 py-2 border border-white/40 
                        rounded-full text-white text-sm sm:text-base 
                        backdrop-blur-sm bg-white/10 
                        hover:bg-white/20 transition duration-300">

                <i class="fa-solid fa-clock"></i>
                <span>Lunes a Viernes de 8 a 20 hs</span>
            </div>

            <!-- Badge 3 -->
            <div class="flex items-center gap-2 px-4 py-2 border border-white/40 
                        rounded-full text-white text-sm sm:text-base 
                        backdrop-blur-sm bg-white/10 
                        hover:bg-white/20 transition duration-300">

                <i class="fa-solid fa-headset"></i>
                <span>Soporte personalizado</span>
            </div>

</div>

        </div>

        <!-- FORMULARIO -->
        <div class="group backdrop-blur-md bg-white/70 border border-white/40 
                    rounded-2xl shadow-xl p-6 sm:p-8 
                    transition duration-300 hover:shadow-2xl"
             data-aos="fade-up"
             data-aos-delay="300"
             data-aos-anchor-placement="top-bottom">

            <form #formRef="ngForm" (ngSubmit)="enviarFormulario(formRef)" class="space-y-4">

                <!-- Nombre -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Nombre</label>
                    <input type="text"
                        name="nombre"
                        ngModel
                        required
                        placeholder="Tu nombre"
                        class="w-full bg-white/80 border border-gray-300 rounded-lg px-4 py-2 
                        focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition" />
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Email</label>
                    <input type="email"
                        name="email"
                        ngModel
                        required
                        placeholder="tu@email.com"
                        class="w-full bg-white/80 border border-gray-300 rounded-lg px-4 py-2 
                        focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition" />
                </div>

                <!-- Teléfono -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Teléfono</label>
                    <input type="tel"
                        name="telefono"
                        ngModel
                        required
                        placeholder="Tu teléfono"
                        class="w-full bg-white/80 border border-gray-300 rounded-lg px-4 py-2 
                        focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition" />
                </div>

                <!-- Mensaje -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Mensaje</label>
                    <textarea rows="4"
                            name="mensaje"
                            ngModel
                            required
                            placeholder="Escribí tu consulta..."
                            class="w-full bg-white/80 border border-gray-300 rounded-lg px-4 py-2 
                            focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition"></textarea>
                </div>

                <!-- Botón -->
                <button type="submit"
                        [disabled]="enviando"
                        class="w-full bg-[#00cba9] hover:bg-[#00b89a] 
                        text-white font-semibold py-3 rounded-lg 
                        transition duration-300 shadow-md 
                        disabled:opacity-60 disabled:cursor-not-allowed 
                        hover:scale-[1.02] flex items-center justify-center gap-2">

                    <!-- Spinner -->
                    <span *ngIf="enviando" 
                        class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin">
                    </span>

                    <!-- Texto dinámico -->
                    {{ enviando ? 'Enviando...' : 'Enviar consulta' }}

                </button>

            </form>

            <!-- Línea animada -->
            <div class="w-0 h-1 bg-[#00cba9] mx-auto mt-5 transition-all duration-300 group-hover:w-24"></div>

        </div>

    </div>

</section>
