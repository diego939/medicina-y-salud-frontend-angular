<section class="bg-[#00cba9] py-20 px-4 sm:px-10 relative overflow-hidden">

    <!-- Fondo decorativo -->
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_top,white,transparent)]"></div>

    <div class="max-w-6xl mx-auto grid lg:grid-cols-2 gap-10 items-center relative z-10">

        <!-- TEXTO -->
        <div data-aos="fade-right" class="text-white">

            <h2 class="text-3xl sm:text-5xl font-bold mb-4">
                Contactanos
            </h2>

            <p class="text-sm sm:text-lg max-w-md mb-6">
                Estamos para ayudarte. Dejanos tu consulta y te responderemos a la brevedad con la atención que merecés.
            </p>

            <div class="space-y-3 text-sm sm:text-base">
                <p>📍 Atención médica integral</p>
                <p>⏰ Lunes a Viernes de 8 a 20 hs</p>
                <p>📞 Soporte personalizado</p>
            </div>

        </div>

        <!-- FORMULARIO -->
        <div data-aos="fade-left"
             class="group backdrop-blur-md bg-white/70 border border-white/40 
             rounded-2xl shadow-xl p-6 sm:p-8 
             transition duration-300 hover:shadow-2xl">

            <form class="space-y-4">

                <!-- Nombre -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Nombre</label>
                    <input type="text"
                           placeholder="Tu nombre"
                           class="w-full bg-white/80 border border-gray-300 rounded-lg px-4 py-2 
                           focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition" />
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Email</label>
                    <input type="email"
                           placeholder="tu@email.com"
                           class="w-full bg-white/80 border border-gray-300 rounded-lg px-4 py-2 
                           focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition" />
                </div>

                <!-- Teléfono -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Teléfono</label>
                    <input type="tel"
                           placeholder="Tu teléfono"
                           class="w-full bg-white/80 border border-gray-300 rounded-lg px-4 py-2 
                           focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition" />
                </div>

                <!-- Mensaje -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Mensaje</label>
                    <textarea rows="4"
                              placeholder="Escribí tu consulta..."
                              class="w-full bg-white/80 border border-gray-300 rounded-lg px-4 py-2 
                              focus:outline-none focus:ring-2 focus:ring-[#00cba9] transition"></textarea>
                </div>

                <!-- Botón -->
                <button type="submit"
                        class="w-full bg-[#00cba9] hover:bg-[#00b89a] 
                        text-white font-semibold py-3 rounded-lg 
                        transition duration-300 shadow-md 
                        hover:scale-[1.02]">
                    Enviar consulta
                </button>

            </form>

            <!-- Línea animada -->
            <div class="w-0 h-1 bg-[#00cba9] mx-auto mt-5 transition-all duration-300 group-hover:w-24"></div>

        </div>

    </div>

</section>
